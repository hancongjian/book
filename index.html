<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在进入实验室预约…</title>
</head>
<body style="font-family:-apple-system,sans-serif;text-align:center;padding-top:38vh;color:#333;background:#fff">
<p id="m" style="font-size:16px">正在进入实验室预约系统…</p>
<button id="b" onclick="go()" style="display:none;margin-top:18px;padding:10px 24px;font-size:15px;border:1px solid #ccc;border-radius:10px;background:#fff;color:#333">重新加载</button>
<script>
var tries = 0;

function fetchTimeout(url, opts, ms) {
  return new Promise(function (resolve, reject) {
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); reject(new Error('timeout')); }, ms);
    fetch(url, Object.assign({ signal: ctrl.signal }, opts || {}))
      .then(function (r) { clearTimeout(timer); resolve(r); })
      .catch(function (e) { clearTimeout(timer); reject(e); });
  });
}

// 三条通道，按"无限流优先"排序：
//   主：同源 ./target.txt —— 走 GitHub Pages CDN，没有任何次数限制，全班同时扫码也不怕
//   备：GitHub API —— 写入后即时生效，但匿名请求只有 60 次/小时，只能兜底
//   再备：raw.githubusercontent.com —— 另一条 CDN 路径
// 地址稳定后 target.txt 里的值一直有效，主通道足够了。
function getTarget(t) {
  return fetchTimeout('./target.txt?t=' + t, { cache: 'no-store' }, 3500)
    .then(function (r) { if (!r.ok) throw new Error('pages ' + r.status); return r.text(); })
    .catch(function () {
      return fetchTimeout('https://api.github.com/repos/hancongjian/book/contents/target.txt?t=' + t, { cache: 'no-store' }, 2500)
        .then(function (r) { if (!r.ok) throw new Error('api ' + r.status); return r.json(); })
        .then(function (j) { return atob(j.content.replace(/\n/g, '')); })
        .catch(function () {
          return fetchTimeout('https://raw.githubusercontent.com/hancongjian/book/main/target.txt?t=' + t, { cache: 'no-store' }, 3000)
            .then(function (r) { if (!r.ok) throw new Error('raw ' + r.status); return r.text(); });
        });
    });
}

function go() {
  var m = document.getElementById('m'), b = document.getElementById('b');
  b.style.display = 'none';
  m.textContent = '正在进入实验室预约系统…';
  getTarget(Date.now())
    .then(function (txt) {
      var u = (txt || '').trim();
      if (!/^https:\/\/[a-z0-9.-]+/i.test(u)) throw new Error('bad');
      location.replace(u);
    })
    .catch(function () {
      tries++;
      if (tries < 8) { setTimeout(go, 2000); return; }
      m.textContent = '管理员正在切换网络，约 1 分钟后可恢复，请点击下方按钮重试';
      b.style.display = 'inline-block';
    });
}
go();
</script>
</body>
</html>
