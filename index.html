<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>正在进入实验室预约…</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding-top:40vh">
<p id="m">正在进入实验室预约系统…</p>
<script>
fetch("https://api.github.com/repos/hancongjian/book/contents/target.txt?t=" + Date.now(), { headers: { "Accept": "application/vnd.github+json" } })
  .then(function (r) { return r.json(); })
  .then(function (j) { location.replace(atob(j.content.replace(/\n/g, ""))); })
  .catch(function () { document.getElementById("m").textContent = "打开失败，请刷新重试"; });
</script>
</body>
